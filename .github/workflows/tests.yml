name: Core tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip ".[test]"
      - name: Compile supported Python sources
        run: python -m compileall -q radiofisher tests chime2021/experiments_CHIME.py
      - name: Run focused tests
        run: python -m pytest -q
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Verify installed wheel metadata
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -I -c "import radiofisher; assert radiofisher.__version__ == '1.0.0'; assert radiofisher.BACKEND_API_VERSION == 1"
